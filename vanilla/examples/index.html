<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand UI - Component Library</title>
  <base href="/examples/">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- All CSS -->
  <link rel="stylesheet" href="../css/ui.css">

  <!-- Prevent theme flash -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
      } else if (saved === 'light') {
        document.documentElement.classList.add('light');
      }
    })();
  </script>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="app-sidebar-header">
        <a href="index.html" class="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Overview</span>
        </a>
      </div>
      <div class="app-sidebar-content">
        <div class="app-sidebar-group-label">Components</div>
        <ul class="sidebar-menu" id="sidebar-menu"></ul>
      </div>
    </aside>

    <!-- Main -->
    <div class="app-main">
      <header class="app-header">
        <div class="header-left">
          <button class="sidebar-trigger" id="sidebar-toggle" aria-label="Toggle Sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          </button>
          <div class="header-separator"></div>
          <span>UI Components</span>
        </div>
        <button id="theme-toggle" class="btn btn-ghost btn-sm">Dark</button>
      </header>

      <main class="app-content" style="max-width: none;">
        <div class="overview-header">
          <h1>Design System</h1>
          <p>55+ reusable UI components built with vanilla HTML, CSS, and JavaScript.</p>
        </div>

        <div class="category-grid" id="category-grid"></div>

        <div class="tip-card">
          <p>Press <kbd class="kbd">Cmd</kbd> + <kbd class="kbd">B</kbd> to toggle the sidebar.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Core JS -->
  <script src="../js/core.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    // Component categories
    const categories = [
      {
        label: "Buttons & Actions",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></svg>',
        components: [
          { name: "Button", path: "button" },
          { name: "Button Group", path: "button-group" },
          { name: "Toggle", path: "toggle" },
          { name: "Toggle Group", path: "toggle-group" },
        ],
      },
      {
        label: "Form Inputs",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h1a3 3 0 0 1 3 3 3 3 0 0 1 3-3h1"/><path d="M13 20h-1a3 3 0 0 1-3-3 3 3 0 0 1-3 3H5"/><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"/><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"/><path d="M9 7v10"/></svg>',
        components: [
          { name: "Input", path: "input" },
          { name: "Textarea", path: "textarea" },
          { name: "Select", path: "select" },
          { name: "Checkbox", path: "checkbox" },
          { name: "Radio Group", path: "radio-group" },
          { name: "Switch", path: "switch" },
          { name: "Slider", path: "slider" },
          { name: "Calendar", path: "calendar" },
          { name: "Combobox", path: "combobox" },
        ],
      },
      {
        label: "Data Display",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>',
        components: [
          { name: "Badge", path: "badge" },
          { name: "Avatar", path: "avatar" },
          { name: "Card", path: "card" },
          { name: "Table", path: "table" },
          { name: "Progress", path: "progress" },
          { name: "Skeleton", path: "skeleton" },
          { name: "Carousel", path: "carousel" },
        ],
      },
      {
        label: "Navigation",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
        components: [
          { name: "Tabs", path: "tabs" },
          { name: "Breadcrumb", path: "breadcrumb" },
          { name: "Pagination", path: "pagination" },
          { name: "Command", path: "command" },
          { name: "Menubar", path: "menubar" },
        ],
      },
      {
        label: "Feedback",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
        components: [
          { name: "Alert", path: "alert" },
          { name: "Tooltip", path: "tooltip" },
          { name: "Toast", path: "toast" },
          { name: "Spinner", path: "spinner" },
        ],
      },
      {
        label: "Overlays",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>',
        components: [
          { name: "Dialog", path: "dialog" },
          { name: "Alert Dialog", path: "alert-dialog" },
          { name: "Sheet", path: "sheet" },
          { name: "Drawer", path: "drawer" },
          { name: "Popover", path: "popover" },
          { name: "Dropdown Menu", path: "dropdown-menu" },
        ],
      },
      {
        label: "Layout",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>',
        components: [
          { name: "Accordion", path: "accordion" },
          { name: "Collapsible", path: "collapsible" },
          { name: "Resizable", path: "resizable" },
          { name: "Sidebar", path: "sidebar" },
          { name: "Separator", path: "separator" },
        ],
      },
      {
        label: "Charts",
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>',
        components: [{ name: "Chart", path: "chart" }],
      },
    ];

    // Render category grid
    const categoryGrid = document.getElementById('category-grid');
    categories.forEach(category => {
      const card = document.createElement('div');
      card.className = 'category-card';
      card.innerHTML = `
        <div class="category-header">
          ${category.icon}
          ${category.label}
        </div>
        <div class="category-content">
          <div class="component-tags">
            ${category.components.map(c =>
              `<a href="./components/${c.path}.html" class="component-tag">${c.name}</a>`
            ).join('')}
          </div>
        </div>
      `;
      categoryGrid.appendChild(card);
    });
  </script>
</body>
</html>
